<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>上傳測試頁面</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }
        .log { background: #f0f0f0; padding: 10px; margin: 10px 0; border-radius: 5px; max-height: 400px; overflow-y: auto; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        input[type="file"] { margin: 10px 0; }
    </style>
</head>
<body>
    <h1>🧪 上傳診斷測試</h1>

    <div>
        <input type="file" id="fileInput" accept=".xlsx">
        <button onclick="testUpload()">測試上傳</button>
    </div>

    <h3>診斷日誌：</h3>
    <div class="log" id="log"></div>

    <script>
        const API_URL = 'http://10.100.40.5:8000/api/upload';

        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            const color = type === 'error' ? 'red' : type === 'success' ? 'green' : 'black';
            logDiv.innerHTML += `<div style="color: ${color};">[${timestamp}] ${message}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(`[${type.toUpperCase()}]`, message);
        }

        async function testUpload() {
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];

            if (!file) {
                log('❌ 請先選擇檔案', 'error');
                return;
            }

            log(`📁 選擇的檔案: ${file.name}`);
            log(`📏 檔案大小: ${(file.size / 1024).toFixed(2)} KB`);
            log(`📝 檔案類型: ${file.type}`);

            const formData = new FormData();
            formData.append('file', file);
            log('✅ FormData 建立完成');

            log(`🌐 上傳 URL: ${API_URL}`);
            log('📤 開始上傳...');

            try {
                const startTime = Date.now();

                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: formData
                });

                const endTime = Date.now();
                const duration = ((endTime - startTime) / 1000).toFixed(2);

                log(`⏱️ 請求耗時: ${duration} 秒`);
                log(`📊 HTTP 狀態: ${response.status} ${response.statusText}`);

                const contentType = response.headers.get('content-type');
                log(`📋 Content-Type: ${contentType}`);

                if (response.ok) {
                    const result = await response.json();
                    log('✅ 上傳成功！', 'success');
                    log(`📄 回應內容: ${JSON.stringify(result, null, 2)}`);
                } else {
                    const errorText = await response.text();
                    log(`❌ 上傳失敗: ${response.status}`, 'error');
                    log(`📄 錯誤內容: ${errorText}`, 'error');
                }
            } catch (error) {
                log(`❌ 發生錯誤: ${error.message}`, 'error');
                log(`📄 錯誤詳情: ${error.stack}`, 'error');
            }
        }

        log('🚀 測試頁面已載入');
        log(`🎯 API 端點: ${API_URL}`);
    </script>
</body>
</html>
