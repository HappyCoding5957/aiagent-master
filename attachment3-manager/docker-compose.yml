services:
  # 後端 API 服務
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: attachment3-backend
    ports:
      - "8000:8000"
    environment:
      - DB_URL=postgresql://dgtk:dgtk@10.100.40.5:8002/dgtk
      - EMBED_API=http://10.100.40.5:8004/api/embed
    volumes:
      - ./backend:/app
    restart: unless-stopped
    networks:
      - attachment3-network

  # 前端服務
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: attachment3-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - attachment3-network

networks:
  attachment3-network:
    driver: bridge
